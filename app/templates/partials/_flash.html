{% with messages = get_flashed_messages(with_categories=true) %}
  {% if messages %}
    <div class="mx-auto max-w-6xl space-y-2 px-4 pt-4">
      {% for category, message in messages %}
        <div class="rounded-lg border px-4 py-3 text-sm
          {% if category == 'error' %}border-red-500/40 bg-red-500/10 text-red-600 dark:text-red-400
          {% elif category == 'success' %}border-emerald-500/40 bg-emerald-500/10 text-emerald-700 dark:text-emerald-400
          {% else %}border-border bg-surface text-text{% endif %}">
          {{ message }}
        </div>
      {% endfor %}
    </div>
  {% endif %}
{% endwith %}
