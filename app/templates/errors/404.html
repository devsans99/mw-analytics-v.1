{% extends "base.html" %}
{% block title %}Page not found · {{ site_name }}{% endblock %}
{% block content %}
<section class="mx-auto max-w-3xl px-4 py-24 text-center">
  <p class="font-heading text-6xl font-bold text-primary">404</p>
  <h1 class="mt-4 font-heading text-2xl font-semibold">Page not found</h1>
  <p class="mt-2 text-muted">The page you are looking for does not exist.</p>
  <a href="{{ url_for('site.home') }}" class="mt-8 inline-flex rounded-lg bg-primary px-5 py-2 text-sm font-medium text-primary-contrast hover:opacity-90">Back to home</a>
</section>
{% endblock %}
